# Static Next.js export: output: "export" produces ./out.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  # The server-mounted private MP3 library does not exist on public hosting.
  # Build a self-contained visual vinyl preview instead of fetching a 404 catalog.
  NEXT_PUBLIC_MUSIC_MODE = "preview"

# Next.js emits an extensionless Open Graph PNG.
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=3600"
